name: Daily build

# Regenerates the baked per-ticker JSON (chains, AI news takes, technicals)
# eight times a weekday. The commit it pushes triggers Vercel's GitHub
# integration, which deploys the new static files automatically.
#
# Scheduling is handled externally by cron-job.org, which POSTs to the
# workflow_dispatch endpoint at 9:30 America/New_York (the market open) and
# then hourly from 10:00 to 16:00 (the close) on weekdays — eight runs a
# trading day. It takes TWO cron-job.org jobs because one cron line can't mix
# the :30 open with the top-of-hour cadence: `30 9 * * 1-5` fires the open and
# `0 10-16 * * 1-5` fires 10:00–16:00. cron-job.org runs in ET, so it — not
# this workflow — is the single authority on the ET slots and DST. (A previous
# in-workflow ET-hour re-check was dead code: with a workflow_dispatch-only
# trigger it never ran.)
on:
  workflow_dispatch:

permissions:
  contents: write
  # The "AI health alert" step opens/updates/closes the ai-health incident
  # issue (issue creation is what emails the owner — the AI layer degrading
  # never fails the build, so the issue IS the operator signal).
  issues: write

concurrency:
  # Shared across daily / unusual-flow / oi-tracker so the three never commit
  # concurrently — they queue instead of racing on shared files (ai-usage.json,
  # heatmap.json), which previously caused spurious stash-pop conflicts.
  group: stonks-data-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Resolve the freshest tip of the dispatched ref at checkout
          # time (rather than the SHA pinned at dispatch time, which is
          # the @v5 default). Matters when concurrency:cancel-in-progress
          # is false: a run that sat in the queue while a PR merged to
          # main would otherwise build against the stale dispatch SHA
          # and then push its data/ output on top of the newer main —
          # data generated by old code, committed atop new code.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          # Cache ~/.npm keyed on package-lock.json so the per-run dependency
          # download (collapses the ~25-50s cold install of the @google/genai
          # + yahoo-finance2 + @supabase trees) becomes a ~3-8s cache restore.
          cache: "npm"

      - name: Install dependencies
        # `npm ci` installs offline from the committed lockfile (lockfileVersion
        # 3, fully pinned) — deterministic and faster than `npm install` once the
        # cache above is warm. Cache miss falls back to a normal cold install.
        run: npm ci --no-audit --no-fund

      - name: Hydrate data from private store
        # Path B cutover: when PRIVATE_DATA_ENABLED is set, data/ no longer lives
        # in the repo — pull the last-good snapshot from the private blob store so
        # the build's read-before-wipe accumulation has its prior state. No-op
        # (skipped) until the repo variable is set, so flag-off = today's behavior.
        if: ${{ vars.PRIVATE_DATA_ENABLED == '1' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/sync-data.mjs pull

      - name: Build site
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Funded Tier-1 project: Flash/Flash-Lite carry 1K-4K RPM quotas, so
          # the build's per-minute AI pacer (build.mjs AI_RPM, default 100) can
          # run well above the conservative default without risking 429s. The
          # per-ticker passes run on gemini-2.5-flash-lite (4K RPM / 4M TPM).
          # Measured peak at AI_RPM=300 was 279 RPM / 890K TPM (~3.2K tok/req) —
          # i.e. the pacer itself was the binding floor on the per-ticker AI passes.
          # 600 holds peak-minute TPM at ~53% of the 4M quota and ~15% of the 4K
          # RPM quota while halving that RPM-paced floor. Token-neutral — same
          # number of calls, just spaced tighter. (Ceiling ~880 = the 70%-of-4M
          # TPM line at this token size; 750 is the aggressive option.) Leave
          # UNSET on a free-tier fork (Gemma free = 15 RPM; even 100 is too high).
          AI_RPM: "600"
          # Model selection is plumbed through Actions Variables so we can
          # swap models (Gemma free tier → Gemini 2.5 Flash-Lite on paid
          # Tier 1, etc.) without touching code. Unset = build.mjs falls
          # back to its hard-coded Gemma default.
          AI_MODEL: ${{ vars.AI_MODEL }}
          NARRATIVES_MODEL: ${{ vars.NARRATIVES_MODEL }}
          # (PICKS_ACCURACY_AB removed: it was set here but read NOWHERE in the
          # code — the wait-arm cohort it described now enrolls BY DEFAULT,
          # since every actionable pick enrolls cohort-tagged go/wait.)
          # Cost optimization: fold the per-ticker Major-Contract + Guidance
          # signal extraction into the combined ticker-judgment call instead of
          # a second per-ticker round-trip (~1 fewer flash-lite call/ticker/
          # build). OFF unless this is set to "1": it changes a scoring input
          # (data.aiSignals → scoreFundamentals), so enable only after the A/B
          # parity check passes (scripts/ab-signals-merge.mjs). Unset = today's
          # dedicated attachAiContractGuidance pass.
          AI_SIGNALS_COMBINED: ${{ vars.AI_SIGNALS_COMBINED }}
          # Optional: registered BLS Public Data API access. BLS is the
          # PRIMARY source for the macro calendar (CPI/PPI/payrolls/
          # unemployment/JOLTS — FRED only mirrors these); a key lifts the
          # unauthenticated ~25 queries/day cap to 500/day + 20yr history
          # so BLS-primary never gets throttled into a stale day. Without
          # it the build still works on the unauthenticated endpoint. Free
          # key at https://www.bls.gov/developers/api_signature_v2.htm —
          # see fetchBlsSeries in scripts/build.mjs.
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          # Optional: FRED is now the FALLBACK behind BLS (macro) and NY
          # Fed EFFR (the Fed Funds rate), fetched only when the primary
          # returns empty. When set, that fallback fetch uses
          # api.stlouisfed.org (the official JSON API, not the Cloudflare-
          # fronted CSV the runner IPs intermittently get blocked from) so
          # the backstop is reliable too. Without it the fallback still
          # degrades gracefully — see fetchFredSeries in scripts/build.mjs.
          # Free key at https://fred.stlouisfed.org/docs/api/api_key.html.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Optional: when set, OpenFIGI batches use the authenticated
          # rate limit (250 req/min, 100 jobs/req → ~25k mappings/min)
          # instead of the unauthenticated 25 req/min cap. Without it,
          # 13F enrichment skips thousands of CUSIPs per run — see
          # OPENFIGI_MAX_BATCHES_UNAUTH in scripts/build.mjs. Free key
          # at https://www.openfigi.com/api.
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: node scripts/build.mjs

      - name: AI health alert
        # The build NEVER fails on AI-layer trouble — every consumer degrades
        # gracefully (last-good narratives, cached judgments, deterministic
        # thesis cards), which is exactly how the 2026-07-08 Gemini model
        # shutdown ran for ~2 days with green workflows and zero operator
        # signal. This step is the out-of-band alarm: the build writes
        # ./ai-health.json (status ok / degraded / down / keyless); on
        # degraded/down it opens ONE labeled issue (creation notifies the
        # owner by email; while it stays open, later runs only refresh the
        # body — no notification spam at 8 bakes/day), and on a clean "ok" run
        # it closes the issue with a recovery comment. Optional: set the
        # DISCORD_ALERT_WEBHOOK_URL secret to also get a Discord ping on
        # incident open + recovery (one ping each, not one per bake).
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ ! -f ai-health.json ]; then
            echo "no ai-health.json (build failed before the report) — skipping"
            exit 0
          fi
          STATUS=$(jq -r .status ai-health.json)
          REASONS=$(jq -r '.reasons | join("; ")' ai-health.json)
          echo "AI health: $STATUS — $REASONS"
          EXISTING=$(gh issue list --label ai-health --state open --json number --jq '.[0].number // empty' || true)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$STATUS" = "degraded" ] || [ "$STATUS" = "down" ]; then
            TITLE="🚨 AI layer $(echo "$STATUS" | tr 'a-z' 'A-Z') — Gemini calls failing in the data workflows"
            BODY_FILE=$(mktemp)
            { jq -r .md ai-health.json; echo; echo "_Latest run: $RUN_URL ($(date -u +%Y-%m-%dT%H:%MZ))_"; } > "$BODY_FILE"
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --title "$TITLE" --body-file "$BODY_FILE"
              echo "refreshed open ai-health issue #$EXISTING"
            else
              gh label create ai-health --description "Automated AI-layer health incident (daily.yml)" --color D93F0B 2>/dev/null || true
              gh issue create --title "$TITLE" --label ai-health --body-file "$BODY_FILE"
              echo "opened ai-health issue"
              if [ -n "${DISCORD_ALERT_WEBHOOK_URL:-}" ]; then
                curl -sS -X POST -H 'Content-Type: application/json' \
                  -d "$(jq -cn --arg c "🚨 stonks AI layer is $STATUS — $REASONS ($RUN_URL)" '{content:$c}')" \
                  "$DISCORD_ALERT_WEBHOOK_URL" || true
              fi
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "AI layer healthy again this run — $REASONS. ($RUN_URL)"
            echo "closed ai-health issue #$EXISTING (recovered)"
            if [ -n "${DISCORD_ALERT_WEBHOOK_URL:-}" ]; then
              curl -sS -X POST -H 'Content-Type: application/json' \
                -d '{"content":"✅ stonks AI layer recovered — fresh Gemini calls succeeding again."}' \
                "$DISCORD_ALERT_WEBHOOK_URL" || true
            fi
          else
            echo "nothing to do (status=$STATUS, open incident=${EXISTING:-none})"
          fi

      - name: Commit refreshed site
        env:
          # Flag-off (default): commit data/ to the repo as today. Flag-on
          # (Path B cutover): data/ lives in the private store, so it's not staged.
          PRIVATE_DATA_ENABLED: ${{ vars.PRIVATE_DATA_ENABLED }}
        run: |
          set -euo pipefail
          git config user.name "stonks-bot"
          git config user.email "stonks-bot@users.noreply.github.com"
          BRANCH="${GITHUB_REF_NAME:-main}"
          # Retry the commit-and-push up to 3 times so a concurrent commit
          # to main (PR merge, hourly unusual-flow scan) doesn't fail the
          # whole 4-minute build. On each attempt we fetch fresh remote
          # state, reset the index/HEAD to it (working tree keeps our
          # freshly-built artifacts intact), then re-stage and push. This
          # avoids stash/rebase entirely because the daily build wipes and
          # regenerates data/ wholesale — there's nothing local worth
          # merging from the remote, only the new commit base to land on.
          # Files owned by the hourly unusual-flow scanner and the twice-daily
          # oi-tracker. After reset --mixed the working tree still has whatever
          # build.mjs preserved from *before* the build started — but the
          # remote may have a fresher scan / OI snapshot committed while we
          # were running. Restore the remote's copies so we don't clobber them
          # (dropping a rolling oi-history snapshot), then re-run regen-static
          # so the MANIFEST in index.html matches. data/heatmap.json and
          # data/ai-usage.json are deliberately NOT in this list: the bake
          # itself writes both (writeHeatmapFile / writeAiUsageState), so
          # restoring the remote copies would throw away this run's heatmap
          # rebuild and its recorded Gemini spend on every build.
          SCANNER_FILES="data/unusual.json data/unusual-history.json data/unusual-log.json data/volume-flags.json data/volume-history.json data/flow-explanations.json data/oi-tracker.json data/oi-history.json"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --mixed "origin/$BRANCH"
            for f in $SCANNER_FILES; do
              # Write to a temp file first: `git show > "$f"` truncates $f
              # before git show runs, so a path missing on the remote would
              # blank the locally preserved copy.
              if git show "origin/$BRANCH:$f" > "$f.fromremote" 2>/dev/null; then
                mv "$f.fromremote" "$f"
              else
                rm -f "$f.fromremote"
              fi
            done
            node scripts/regen-static.mjs
            git add index.html styles.css app.js
            # Flag-off: commit data/ to the repo as today. Flag-on (Path B
            # cutover): data/ lives in the private store (flushed by the push step
            # below) and is gitignored, so it's never staged here.
            # -f is required because Path B added an unconditional `/data/` to
            # .gitignore — without it `git add data` no-ops on the ignored path
            # and the legacy rollback commits render output with no data.
            if [ "${PRIVATE_DATA_ENABLED:-0}" != "1" ] && [ -d data ]; then git add -f data; fi
            if git diff --cached --quiet; then
              echo "No changes to commit (attempt $attempt)."
              exit 0
            fi
            git commit -m "chore: daily refresh $(date -u +%Y-%m-%d)"
            if git push origin "HEAD:$BRANCH"; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt — remote moved, retrying."
            sleep $((attempt * 5))
          done
          echo "Push failed after 3 attempts." >&2
          exit 1

      - name: Flush data to private store
        # Path B cutover: push the freshly-built data/ (incl. data/manifest.json)
        # to the private blob store. Bake owns everything except the scanner-
        # exclusive keys and delete-stales only the per-ticker + iv-history
        # prefixes. Runs after the commit step so it flushes the final regen-static
        # state. No-op until the repo variable is set.
        if: ${{ vars.PRIVATE_DATA_ENABLED == '1' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/sync-data.mjs push --owner=bake
