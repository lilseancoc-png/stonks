name: Update Checker verification
on:
  pull_request:
  push:
    branches: [main, Update-Checker]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify feature coverage, log detection and private access
        run: |
          npm run test:update-checker
          npm run test:party-tracker
          npm run test:site-map
          npm run test:owner-restrictions
          npm run test:owner-brief
          npm run test:site-catalog
          npm run test:api
          npm run test:contact
          npm run test:sports
          npm run test:picks-outcomes
          npm run test:regime-lab
          npm run test:ai-cost-history
          npm run test:recording
          npm run test:owner-insight
          npm run test:stale-prs
          npm run test:source-health
          npm run test:walk-forward
          npm run test:features-next
          npm run verify:freshness
      - name: Verify the November 2026 engines, odds, labs and Webull mirror
        # These features shipped with tests but no CI step (2026-11-16 audit),
        # so a later change could break them unseen. Offline, about a minute.
        # Called by path: they have no npm scripts on purpose (a package.json
        # change trips verify:risk-cost).
        run: |
          node scripts/vercel-bundle-check.mjs
          node scripts/vercel-bundle-check-smoke.mjs
          node scripts/update-checker-endpoints-smoke.mjs
          node scripts/top-picks-real-prices-smoke.mjs
          node scripts/engines-smoke.mjs
          node scripts/engines-mirror-smoke.mjs
          node scripts/webull-quota-smoke.mjs
          npm run test:prediction
          node scripts/prediction-markets-smoke.mjs
          node scripts/quant-labs-smoke.mjs
          node scripts/factor-universe-smoke.mjs
          node scripts/earnings-forecast-lab-smoke.mjs
          node scripts/flow-direction-smoke.mjs
          node scripts/ai-disruption-smoke.mjs
          node scripts/ai-disruption-collector-smoke.mjs
          node scripts/ai-disruption-scorecard-smoke.mjs
          npm run test:webull-mirror
          npm run test:workflow-schedules
          npm run test:top-picks-watchdog
          node scripts/sports-on-time-smoke.mjs
          npm run test:owner-settings
      - name: Verify the 2026-11-19 to 11-22 builds
        # Webull data, Owner controls, wide tier, policy news, chance of
        # profit and the journal shipped with tests but no CI step
        # (2026-11-22 audit). Offline, about three minutes.
        run: |
          node scripts/trade-pop-smoke.mjs
          node scripts/journal-smoke.mjs
          node scripts/owner-controls-smoke.mjs
          node scripts/owner-desk-smoke.mjs
          node scripts/webull-data-smoke.mjs
          node scripts/webull-w3-smoke.mjs
          node scripts/webull-data-mirror-smoke.mjs
          node scripts/option-history-smoke.mjs
          node scripts/engines-history-smoke.mjs
          node scripts/sports-win-by-smoke.mjs
          node scripts/wide-tier-smoke.mjs
          node scripts/policy-news-smoke.mjs
          node scripts/trade-instructions-smoke.mjs
      - name: Verify the 2026-11-26 builds
        # Last-good stock pages (#936) and the measure-only trade stamps
        # (opposite-side tags, market-risk read). Offline, a few seconds.
        run: |
          node scripts/stale-ticker-copy-smoke.mjs
          node scripts/engine-trade-stamps-smoke.mjs
      - name: Verify browser behavior
        run: |
          npm install --prefix "$RUNNER_TEMP/checker-browser" --no-audit --no-fund playwright@1.64.1
          "$RUNNER_TEMP/checker-browser/node_modules/.bin/playwright" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/checker-browser/node_modules/playwright/index.mjs" npm run test:update-checker-browser
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/checker-browser/node_modules/playwright/index.mjs" npm run test:sports-props-browser
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/checker-browser/node_modules/playwright/index.mjs" npm run test:outage-drill-browser
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/checker-browser/node_modules/playwright/index.mjs" LAYOUT_WIDTHS=390,1440 npm run test:layout-browser
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/checker-browser/node_modules/playwright/index.mjs" npm run test:features-next-browser
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/checker-browser/node_modules/playwright/index.mjs" node scripts/engines-browser.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/checker-browser/node_modules/playwright/index.mjs" node scripts/ai-disruption-browser.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/checker-browser/node_modules/playwright/index.mjs" node scripts/journal-browser.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/checker-browser/node_modules/playwright/index.mjs" node scripts/owner-controls-browser.mjs
