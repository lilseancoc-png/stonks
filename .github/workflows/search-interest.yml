name: Weekly Alt Data refresh

# Refreshes Search Interest, RAM prices, and GPU-cloud prices once each Friday
# at 11:30 ET. No individual stock tickers are collected by Search Interest.
# The workflow spends at most 40 SerpApi requests per run (200 in a five-Friday
# month), leaving room for one manual recovery under the 250-request allowance.
# The paired UTC schedules plus ET route make the slot DST-safe.
on:
  schedule:
    - cron: "30 15 * * 5"
    - cron: "30 16 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stonks-data-commit
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.route.outputs.run }}
    steps:
      - name: Route Friday 11:30 ET slot
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual weekly Alt Data refresh."
            exit 0
          fi
          UTC_HOUR=$(awk '{print $2}' <<<"$TRIGGER_SCHEDULE")
          # Route from the immutable cron expression, not the runner's wall
          # clock. GitHub schedules are best-effort and can start hours late or
          # after midnight UTC; reconstructing the slot with today's date made
          # both Aug. 28 events no-op after they finally started on Aug. 29.
          ET_OFFSET=$(TZ=America/New_York date +%z)
          case "$ET_OFFSET" in
            -0400) EXPECTED_UTC_HOUR=15 ;;
            -0500) EXPECTED_UTC_HOUR=16 ;;
            *)
              echo "::error::Unexpected America/New_York UTC offset: $ET_OFFSET"
              exit 1
              ;;
          esac
          if [ "$UTC_HOUR" = "$EXPECTED_UTC_HOUR" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled Friday 11:30 ET weekly Alt Data refresh (runner delay does not change the routed slot)."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Companion UTC slot is outside Friday 11:30 ET; no-op."
          fi

  refresh:
    needs: route
    if: ${{ needs.route.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify workflow schedule guards
        run: npm run test:workflow-schedules

      - name: Hydrate data from private store
        if: ${{ vars.PRIVATE_DATA_ENABLED == '1' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/sync-data.mjs pull

      - name: Mark freshness window
        # Hydrated prior-run files get fresh mtimes locally; start the window
        # afterward so only this refresh can satisfy the verifier.
        run: echo "FRESHNESS_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_ENV"

      - name: Refresh Google Trends search interest
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SEARCH_TRENDS_CADENCE: "weekly"
          SEARCH_TRENDS_GEO: "US"
          SEARCH_TRENDS_RELATED: "0"
          SEARCH_TRENDS_RELATED_CONCURRENCY: "4"
          SEARCH_TRENDS_MAX_REQUESTS: "40"
        run: node scripts/refresh-search-interest.mjs

      - name: Refresh RAM and GPU-cloud prices
        run: node scripts/refresh-weekly-prices.mjs

      - name: Ensure source revision is still current
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME:-main}"
          git fetch origin "$BRANCH"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$BRANCH")" ]; then
            echo "::error::Source branch moved while this refresh was running. Refusing to publish data generated by stale code."
            exit 1
          fi

      - name: Verify fresh weekly Alt Data
        run: node scripts/verify-data-freshness.mjs --owner=search-interest

      - name: Push weekly Alt Data to private store
        if: ${{ vars.PRIVATE_DATA_ENABLED == '1' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/sync-data.mjs push --owner=search-interest

      - name: Commit legacy public-data output
        if: ${{ vars.PRIVATE_DATA_ENABLED != '1' }}
        run: |
          set -euo pipefail
          git config user.name "stonks-bot"
          git config user.email "stonks-bot@users.noreply.github.com"
          git add -f data/search-interest.json data/ram-prices.json data/accelerator-prices.json
          if git diff --cached --quiet; then
            echo "No weekly Alt Data change"
            exit 0
          fi
          git commit -m "data: refresh weekly Alt Data"
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push origin "HEAD:${GITHUB_REF_NAME:-main}"
