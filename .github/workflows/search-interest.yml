name: Weekly search interest

# Refreshes Google Trends relative interest for the curated Alt-data theme list
# once per week. No individual stock tickers are collected. The workflow spends
# at most 40 SerpApi requests per run (200 in a five-Monday month), leaving room
# for one manual recovery run under the 250-request monthly allowance. Related
# queries are disabled; the core 90-day timelines and change rankings remain.
on:
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stonks-data-commit
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Hydrate data from private store
        if: ${{ vars.PRIVATE_DATA_ENABLED == '1' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/sync-data.mjs pull

      - name: Mark freshness window
        # Hydrated prior-run files get fresh mtimes locally; start the window
        # afterward so only this refresh can satisfy the verifier.
        run: echo "FRESHNESS_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_ENV"

      - name: Refresh Google Trends search interest
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SEARCH_TRENDS_CADENCE: "weekly"
          SEARCH_TRENDS_GEO: "US"
          SEARCH_TRENDS_RELATED: "0"
          SEARCH_TRENDS_RELATED_CONCURRENCY: "4"
          SEARCH_TRENDS_MAX_REQUESTS: "40"
        run: node scripts/refresh-search-interest.mjs

      - name: Ensure source revision is still current
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME:-main}"
          git fetch origin "$BRANCH"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$BRANCH")" ]; then
            echo "::error::Source branch moved while this refresh was running. Refusing to publish data generated by stale code."
            exit 1
          fi

      - name: Verify fresh search-interest data
        run: node scripts/verify-data-freshness.mjs --owner=search-interest

      - name: Push search-interest data to private store
        if: ${{ vars.PRIVATE_DATA_ENABLED == '1' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/sync-data.mjs push --owner=search-interest

      - name: Commit legacy public-data output
        if: ${{ vars.PRIVATE_DATA_ENABLED != '1' }}
        run: |
          set -euo pipefail
          git config user.name "stonks-bot"
          git config user.email "stonks-bot@users.noreply.github.com"
          # /data/ remains ignored even in rollback mode; force this one legacy
          # artifact just like the daily, unusual-flow, and OI workflows do.
          git add -f data/search-interest.json
          if git diff --cached --quiet; then
            echo "No search-interest change"
            exit 0
          fi
          git commit -m "data: refresh Google Trends search interest"
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push origin "HEAD:${GITHUB_REF_NAME:-main}"
