name: Webull paper reconciliation

# Started by the 11:00 / 15:30 ET Top Picks builds (daily.yml dispatches it
# right after verified publication) and by hand for recovery. Its own queue,
# so the mirror's bounded follow-up window never holds the shared
# stonks-data-commit queue. webull-eod.yml owns the closing window.
on:
  workflow_dispatch:
    inputs:
      follow_ups:
        description: "Two-minute follow-up checks while orders are pending (0, 2 or 4)"
        required: false
        default: "4"

concurrency:
  group: stonks-webull-mirror
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    if: ${{ vars.PRIVATE_DATA_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Reconcile Webull paper orders and expiry exposure
        timeout-minutes: 15
        env:
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          WEBULL_MIRROR_STRICT: '1'
          WEBULL_MIRROR_FOLLOW_UPS: ${{ inputs.follow_ups || '4' }}
        run: node scripts/webull-mirror-trigger.mjs
