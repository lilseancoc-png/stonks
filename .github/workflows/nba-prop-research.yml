name: NBA prop research

# NBA-only captures timed for tip-offs. NBA games start on the hour or the
# half hour, and the research record's closing-line value counts only a
# capture within ten minutes before the start, so this runs at :22 and :52
# (eight minutes before each possible tip) from 16:22 to 03:52 UTC (11:22 AM
# to 10:52 PM Eastern in winter): 24 runs a day, cut on 2026-11-17 from 150
# runs every five minutes (Owner choice). Two bulk requests per run (48 a
# day); it skips the game spread/total request (--no-game-lines) and reads
# the line the hourly props scan archived. Games close using real clocks,
# never the cron, so a late start only loses that game's closing capture.
on:
  schedule:
    - cron: '22,52 0-3,16-23 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stonks-nba-prop-research
  cancel-in-progress: false
jobs:
  research:
    if: ${{ vars.PRIVATE_DATA_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:nba-alpha
      - name: Capture NBA decision evidence
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: node scripts/refresh-sports-props.mjs --sport=nba --no-game-lines
