name: Sports prop picks

# Sports uses its own scheduler, separate from the market-data bakes.
# Hourly at :37 from 14:37 to 04:37 UTC (9:37 AM to 11:37 PM Eastern in
# winter, an hour later in summer): 15 runs a day, cut from every 30 minutes
# around the clock on 2026-11-17 (Owner choice; overnight runs found no new
# lines). Five bulk line requests per run (three NBA: PrizePicks, sportsbook
# player prices and game lines; two NFL: PrizePicks and sportsbook prices),
# about 75 a day of the free 1,000. The props record's closing line counts
# when it is seen within four hours of the start, which hourly runs cover.
# No AI, sportsbook account or bets.
on:
  schedule:
    - cron: "37 0-4,14-23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stonks-sports-props
  cancel-in-progress: false

jobs:
  picks:
    if: ${{ vars.PRIVATE_DATA_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:sports-props
      - name: Record pregame picks
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: node scripts/refresh-sports-props.mjs
