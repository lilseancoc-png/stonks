name: Sports prop picks

# Sports uses its own scheduler, separate from the market-data bakes.
# Four bulk line requests per run (192/day: three NBA, for PrizePicks, sportsbook player prices
# and sportsbook game lines, and one NFL) leave room on the free 1,000/day feed for Owner page
# refreshes. No AI, sportsbook account or bets.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stonks-sports-props
  cancel-in-progress: false

jobs:
  picks:
    if: ${{ vars.PRIVATE_DATA_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:sports-props
      - name: Record pregame picks
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: node scripts/refresh-sports-props.mjs
