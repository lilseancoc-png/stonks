name: Near-term OI tracker

# Twice-daily near-term open-interest scan. Sweeps the curated ticker
# universe for the front two option expirations (this week + next week),
# surfaces the top 12 OI strikes per ticker, computes ΔOI day-over-day
# against the prior trading-day snapshot, and lights up a Gamma Squeeze
# Score (0–5) with reason chips. Writes data/oi-tracker.json (current
# snapshot consumed by the UI) and data/oi-history.json (rolling
# snapshots used to compute next-run's ΔOI).
#
# Scheduling is handled externally by cron-job.org, which POSTs to the
# workflow_dispatch endpoint twice on weekdays:
#   • Pre-market scan ~08:30 America/New_York (1h before the bell)
#   • EOD scan      ~19:00 America/New_York (3h after the close)
# cron-job.org runs in ET, so it — not this workflow — is the single authority
# on the ET slots and DST. (A previous in-workflow ET-hour re-check was dead
# code under a workflow_dispatch-only trigger.)
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shared across daily / unusual-flow / oi-tracker so the three never commit
  # concurrently — they queue instead of racing on shared files. Not cancelled
  # in-progress so a partial sweep always finishes.
  group: stonks-data-commit
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Resolve the freshest tip of the dispatched ref at checkout
          # time (rather than the SHA pinned at dispatch time, which is
          # the @v5 default). Matters when concurrency:cancel-in-progress
          # is false: a queued run that sat through another commit
          # landing on main would otherwise scan against stale code.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          # Cache ~/.npm keyed on package-lock.json — turns the cold dependency
          # install into a fast cache restore.
          cache: "npm"

      - name: Install dependencies
        # Offline, deterministic install from the committed lockfile.
        run: npm ci --no-audit --no-fund

      - name: Hydrate data from private store
        # Path B cutover: pull the last-good snapshot so the OI scan's ΔOI /
        # history reads have prior state. No-op until PRIVATE_DATA_ENABLED is set.
        if: ${{ vars.PRIVATE_DATA_ENABLED == '1' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/sync-data.mjs pull

      - name: Mark freshness window
        # Hydrated prior-run files get fresh mtimes locally; start the window
        # afterward so only this scanner's writes can satisfy the verifier.
        run: echo "FRESHNESS_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_ENV"

      - name: Scan near-term open interest
        # No AI required — the Gamma Squeeze Score is a fully rule-based
        # 0-5 tally. The scanner also reads data/unusual.json (when
        # present) to fold "aggressive ask-side call buying today" into
        # the score, but never writes it.
        run: node scripts/scan-oi.mjs

      - name: Prepare final static output
        run: node scripts/regen-static.mjs

      - name: Ensure source revision is still current
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME:-main}"
          git fetch origin "$BRANCH"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$BRANCH")" ]; then
            echo "::error::Source branch moved while this scan was running. Refusing to publish data generated by stale code."
            exit 1
          fi

      - name: Verify fresh OI data
        run: node scripts/verify-data-freshness.mjs --owner=oi

      - name: Flush verified data to private store
        if: ${{ vars.PRIVATE_DATA_ENABLED == '1' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/sync-data.mjs push --owner=oi

      - name: Commit verified private-store scan
        if: ${{ vars.PRIVATE_DATA_ENABLED == '1' }}
        run: |
          set -euo pipefail
          git config user.name "stonks-bot"
          git config user.email "stonks-bot@users.noreply.github.com"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git add index.html app.js styles.css
          if git diff --cached --quiet; then
            echo "No static changes to commit."
            exit 0
          fi
          SCAN_LABEL=$(TZ=America/New_York date +%H)
          if [ "$SCAN_LABEL" = "08" ]; then
            MSG="chore: pre-market OI scan $(date -u +%Y-%m-%dT%H:%MZ)"
          elif [ "$SCAN_LABEL" = "19" ]; then
            MSG="chore: EOD OI scan $(date -u +%Y-%m-%dT%H:%MZ)"
          else
            MSG="chore: OI scan $(date -u +%Y-%m-%dT%H:%MZ)"
          fi
          git commit -m "$MSG"
          git push origin "HEAD:$BRANCH"

      - name: Commit refreshed OI snapshot (legacy public data)
        if: ${{ vars.PRIVATE_DATA_ENABLED != '1' }}
        env:
          # Flag-off (default): commit data/ to the repo as today. Flag-on
          # (Path B cutover): data/ lives in the private store, gitignored.
          PRIVATE_DATA_ENABLED: ${{ vars.PRIVATE_DATA_ENABLED }}
        run: |
          # set -e so a failed rebase / stash pop fails the workflow
          # loudly instead of falling through to a clean-looking "no
          # changes" commit that silently dropped the freshly-scanned
          # files. Mirrors the unusual-flow.yml pattern.
          set -euo pipefail
          git config user.name "stonks-bot"
          git config user.email "stonks-bot@users.noreply.github.com"
          # The verifier's pre-publish regen leaves derived root assets dirty.
          # Clear only those generated files before the legacy rebase; they are
          # regenerated from the rebased + popped data below.
          git restore --worktree index.html app.js styles.css
          DATA_PATHS="data/oi-tracker.json data/oi-history.json data/manifest.json data/manifest-free.json"
          # A push of byte-identical files exits 0 WITHOUT creating a
          # stash entry, so an unconditional pop would die on "No stash
          # entries found" under set -e. Count entries to pop only what
          # we pushed.
          STASH_BEFORE=$(git stash list | wc -l)
          git stash push --all -- $DATA_PATHS || true
          STASH_AFTER=$(git stash list | wc -l)
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          # Don't swallow stash pop errors — a silent conflict here
          # means the freshly-scanned files get discarded and the job
          # ends green with nothing committed.
          if [ "$STASH_AFTER" -gt "$STASH_BEFORE" ]; then
            git stash pop
          fi
          # Regenerate static files NOW, after the rebase + stash pop,
          # so the inlined MANIFEST reflects whatever just landed on
          # main plus our fresh OI scan. Doing it here instead of
          # pre-stash eliminates the index.html merge conflict that
          # fires whenever unusual-flow.yml races us.
          node scripts/regen-static.mjs
          STATIC_PATHS="index.html app.js styles.css"
          # regen-static now also writes data/manifest.json (the externalized
          # premium manifest). Flag-off: commit it with the rest of data/ — else
          # it's left dirty and the next run's `git pull --rebase` aborts. Flag-on
          # (Path B cutover): data/ (incl. manifest.json) is flushed to the store
          # by the push step below and is gitignored, so only the render output
          # (shell + code, public-safe) is committed here.
          if [ "${PRIVATE_DATA_ENABLED:-0}" = "1" ]; then
            git add $STATIC_PATHS
          else
            # -f forces past the unconditional `/data/` .gitignore (Path B);
            # without it this add fails the whole step under set -e. Include
            # manifest-free.json too (regen-static writes both sidecars) — else
            # the free sidecar is left dirty and the next run's rebase aborts.
            git add -f $DATA_PATHS data/manifest.json data/manifest-free.json
            git add $STATIC_PATHS
          fi
          if ! git diff --cached --quiet; then
            SCAN_LABEL=$(TZ=America/New_York date +%H)
            if [ "$SCAN_LABEL" = "08" ]; then
              MSG="chore: pre-market OI scan $(date -u +%Y-%m-%dT%H:%MZ)"
            elif [ "$SCAN_LABEL" = "19" ]; then
              MSG="chore: EOD OI scan $(date -u +%Y-%m-%dT%H:%MZ)"
            else
              MSG="chore: OI scan $(date -u +%Y-%m-%dT%H:%MZ)"
            fi
            git commit -m "$MSG"
            git push
          else
            echo "No changes to commit."
          fi
