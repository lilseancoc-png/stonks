name: Seed / sync private data store

# Manual maintenance tool for the Path B private-data migration
# (docs/private-data-migration.md). One-time seeding uploads the currently
# committed data/ into the private blob store; `pull` is a read-only
# connectivity check (nothing is persisted — the runner is ephemeral).
#
# Dispatch from the Actions tab (must be on the default branch to appear).
# Default is a DRY RUN so the first click is safe — re-run with dry_run=false
# to actually write. Requires the BLOB_READ_WRITE_TOKEN Actions secret.
on:
  workflow_dispatch:
    inputs:
      command:
        description: "sync-data command"
        type: choice
        options:
          - seed
          - pull
        default: seed
      dry_run:
        description: "Dry run (print actions, write nothing)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Share the data-commit group so a seed never overlaps a bake/scan run.
  group: stonks-data-commit
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run sync-data
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          ARGS="${{ inputs.command }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "» node scripts/sync-data.mjs $ARGS"
          node scripts/sync-data.mjs $ARGS
