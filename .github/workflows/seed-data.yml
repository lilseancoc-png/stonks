name: Inspect / flatten private data store

# Manual maintenance tool for the Path B private-data migration
# (docs/private-data-migration.md). `pull` is a read-only connectivity and
# snapshot-integrity check (nothing is persisted — the runner is ephemeral), and
# `flatten` materializes the active generation at legacy roots before a code
# rollback. Generation publishes flip one pointer only after all objects land.
#
# Dispatch from the Actions tab (must be on the default branch to appear).
# `data/` is intentionally absent from a public-repo checkout, so seeding must
# be run locally from an explicitly hydrated directory; exposing `seed` here
# could only attempt an empty snapshot. Default is a DRY RUN so the first click
# is safe — re-run flatten with dry_run=false to write. Requires R2_* secrets.
on:
  workflow_dispatch:
    inputs:
      command:
        description: "sync-data command"
        type: choice
        options:
          - pull
          - flatten
        default: pull
      dry_run:
        description: "Dry run (print actions, write nothing)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Share the data-commit group so maintenance never overlaps a bake/scan run.
  group: stonks-data-commit
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run sync-data
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          ARGS="${{ inputs.command }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "» node scripts/sync-data.mjs $ARGS"
          node scripts/sync-data.mjs $ARGS
