name: Live Day Trades

# High-frequency LIVE Day Trades pass. Unlike the hourly "Unusual options flow"
# workflow, this fetches ONLY batched underlying quotes (no option chains, no
# Gemini) and reuses the same volume + Day Trades engine — cheap enough to run
# every ~15 minutes so new day-trade ideas and durable take-profit / stop-loss
# closes land DURING the session, not just on the hourly full scan.
#
# It writes ONLY data/day-trades.json + data/day-trades-history.json. It does NOT
# regenerate index.html/app.js/styles.css (Day Trades is lazy-fetched, not inlined
# in the manifest) and does NOT touch volume-flags/volume-history (the hourly full
# scan owns those — their bucket deltas need a strictly hourly snapshot cadence).
#
# Scheduling is handled externally by cron-job.org, which POSTs to the
# workflow_dispatch endpoint every ~15 minutes from 9:30 to 16:00
# America/New_York on weekdays. cron-job.org runs in ET so DST is handled by the
# service (matching daily.yml / unusual-flow.yml / oi-tracker.yml).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shared with daily / unusual-flow / oi-tracker so runs never write the private
  # store (or commit) concurrently — they queue instead of racing on the
  # day-trades keys. Not cancelled in-progress so a started run always finishes.
  group: stonks-data-commit
  cancel-in-progress: false

jobs:
  day-trades:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Resolve the freshest tip of the dispatched ref (not the SHA pinned at
          # dispatch time) so a queued run scans against current code.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Hydrate data from private store
        # Path B: pull the last-good snapshot so the engine has the current
        # roster + the nightly-baked per-ticker JSON (avg20, S/R levels, gamma
        # chain) it reads. No-op until PRIVATE_DATA_ENABLED is set.
        if: ${{ vars.PRIVATE_DATA_ENABLED == '1' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/sync-data.mjs pull

      - name: Run live Day Trades pass
        run: node scripts/scan-day-trades.mjs

      - name: Commit refreshed day trades
        # Flag-off (legacy): commit the two day-trades files to the repo. Flag-on
        # (Path B): data/ is gitignored and flushed to the store below, so this
        # is a no-op commit.
        env:
          PRIVATE_DATA_ENABLED: ${{ vars.PRIVATE_DATA_ENABLED }}
        run: |
          set -euo pipefail
          if [ "${PRIVATE_DATA_ENABLED:-0}" = "1" ]; then
            echo "Path B: data/ flushed to the private store, nothing to commit."
            exit 0
          fi
          git config user.name "stonks-bot"
          git config user.email "stonks-bot@users.noreply.github.com"
          DATA_PATHS="data/day-trades.json data/day-trades-history.json"
          STASH_BEFORE=$(git stash list | wc -l)
          git stash push --include-untracked $DATA_PATHS || true
          STASH_AFTER=$(git stash list | wc -l)
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          if [ "$STASH_AFTER" -gt "$STASH_BEFORE" ]; then
            git stash pop
          fi
          git add $DATA_PATHS
          if ! git diff --cached --quiet; then
            git commit -m "chore: live day-trades refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Flush data to private store
        # Path B: push ONLY the two day-trades keys (upsert-only). No-op until
        # the repo variable is set.
        if: ${{ vars.PRIVATE_DATA_ENABLED == '1' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/sync-data.mjs push --owner=daytrades
